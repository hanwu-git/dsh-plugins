# Prompt polish: one button under the composer that rewrites the prompt in place.
#
# The Host half exists because the browser has no model access; it registers one
# authorized route and calls the session's own selected model. Nothing is
# persisted, so the row needs no storage config.
- insert:
    - id: prompt-polish-host
      name: '@local/prompt-polish'
      config:
        timeoutMs: 45000
        maxOutputTokens: 1500
